[package]
name = "lentil-ffi"
description = "UniFFI bindings of lentil-core for the Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "lentil_ffi"

[[bin]]
# Generates the Kotlin bindings during the Gradle build (CONTRIBUTING: Build).
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Only the host's bindings generator needs UniFFI's command line; the library
# built for Android stays without it.
bindgen = ["uniffi/cli"]

[dependencies]
lentil-core.workspace = true
uniffi.workspace = true
# Reads the local `main` for offline reading; the core's GitBackend only
# offers the fetched head.
git2.workspace = true
jiff.workspace = true
thiserror.workspace = true

[lints]
workspace = true
