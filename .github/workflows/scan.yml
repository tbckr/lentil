# Daily vulnerability scan of the lockfiles (CONTRIBUTING: Vulnerability scanning).
#
# install-nix-action gets the job's read-only token, as in ci.yml.
#
# Actions are pinned by commit SHA with a "# vX.Y.Z" comment (CONTRIBUTING: CI
# and hosting); Dependabot (.github/dependabot.yml) bumps them monthly.
name: Scan

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# A manual run while the scheduled one is running waits for it.
concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  osv:
    name: osv-scanner (lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command osv-scanner scan source --lockfile Cargo.lock --lockfile uv.lock --recursive android
