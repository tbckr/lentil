# Daily vulnerability scan of the lockfiles (CONTRIBUTING: Vulnerability scanning).
name: Scan

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix develop --command osv-scanner scan source --lockfile Cargo.lock --lockfile uv.lock --recursive android
