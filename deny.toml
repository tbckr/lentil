# cargo-deny: licenses, duplicate versions, advisories and sources (CONTRIBUTING: Dependencies).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained, not vulnerable; reaches us only through uniffi_bindgen at
    # build time. Revisit with the next UniFFI upgrade.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via uniffi_bindgen" },
]

[licenses]
version = 2
# Licenses compatible with distributing Lentil under GPL-3.0-only.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-only",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
